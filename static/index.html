<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampleAudio</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>SampleAudio</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search songs, artists, albums..." autocomplete="off">
                <button id="searchBtn" onclick="doSearch()">Search</button>
            </div>
            <div class="quality-selector">
                <label>Quality:</label>
                <select id="qualitySelect">
                    <option value="normal">YouTube Music 128kbps</option>
                    <option value="saavn">JioSaavn 320kbps (Clean)</option>
                    <option value="lossless">Tidal FLAC (Lossless)</option>
                </select>
                <label class="clean-toggle">
                    <input type="checkbox" id="cleanToggle" checked>
                    Clean Audio (no chatter)
                </label>
            </div>
        </header>

        <main id="mainContent">
            <div id="tabs" class="tabs hidden">
                <button class="tab active" data-tab="songs" onclick="switchTab('songs')">Songs</button>
                <button class="tab" data-tab="artists" onclick="switchTab('artists')">Artists</button>
                <button class="tab" data-tab="albums" onclick="switchTab('albums')">Albums</button>
            </div>

            <div id="results" class="results"></div>

            <div id="artistView" class="artist-view hidden"></div>
            <div id="albumView" class="album-view hidden"></div>
        </main>

        <div id="player" class="player hidden">
            <div class="player-info">
                <img id="playerThumb" src="" alt="">
                <div class="player-text">
                    <div id="playerTitle" class="player-title"></div>
                    <div id="playerArtist" class="player-artist"></div>
                </div>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" onclick="skipBackward()" title="Back 10s">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="9" y="16" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="togglePlay()" title="Play">
                        <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" onclick="skipForward()" title="Forward 10s">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="14" y="16" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
                    </button>
                    <button class="ctrl-btn" onclick="nextTrack()" title="Next">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                <div class="player-progress">
                    <span id="currentTime" class="time-label">0:00</span>
                    <input type="range" id="progressBar" min="0" max="100" value="0" oninput="seekAudio(this.value)">
                    <span id="totalTime" class="time-label">0:00</span>
                </div>
            </div>
            <div class="player-volume">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="#888"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <input type="range" id="volumeBar" min="0" max="100" value="80" oninput="setVolume(this.value)">
            </div>
        </div>
    </div>

    <audio id="audioElement" preload="auto"></audio>
    <script src="/app.js"></script>
</body>
</html>
