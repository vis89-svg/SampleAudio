<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SampleAudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>SampleAudio</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search songs, artists, albums..." autocomplete="off">
                <button id="searchBtn" onclick="doSearch()">Search</button>
            </div>
            <div class="quality-selector">
                <label>Quality:</label>
                <select id="qualitySelect">
                    <option value="normal">YouTube Music 128kbps</option>
                    <option value="saavn">JioSaavn 320kbps (Clean)</option>
                    <option value="lossless">Tidal FLAC (Lossless)</option>
                </select>
                <label class="clean-toggle">
                    <input type="checkbox" id="cleanToggle" checked>
                    Clean Audio (no chatter)
                </label>
            </div>
            <div id="authSection" class="auth-section">
                <div id="guestAuth" class="guest-auth">
                    <a href="/login.html" class="auth-link">Login</a>
                    <a href="/login.html?tab=register" class="auth-link btn-auth">Register</a>
                </div>
                <div id="userAuth" class="user-auth hidden">
                    <div class="user-menu" onclick="toggleUserMenu()">
                        <span id="userIcon" class="user-icon">U</span>
                        <span id="userName" class="user-name"></span>
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
                    </div>
                    <div id="userDropdown" class="user-dropdown hidden">
                        <div class="user-dropdown-header">
                            <span id="dropdownUserName"></span>
                        </div>
                        <div class="user-dropdown-sep"></div>
                        <button onclick="viewProfile()">&#128100; Profile</button>
                        <button onclick="viewLikes()">&#9829; Liked Songs</button>
                        <button onclick="viewHistory()">&#128338; Recently Played</button>
                        <button onclick="viewFollowedArtists()">&#127908; Followed Artists</button>
                        <div class="user-dropdown-sep"></div>
                        <button onclick="connectYTMusic()" id="connectYTBtn">&#127925; Connect YouTube Music</button>
                        <div class="user-dropdown-sep"></div>
                        <button onclick="logout()" class="logout-btn">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <nav id="mainNav" class="main-nav">
            <button class="nav-btn active" onclick="showHome()">&#127968; Home</button>
            <button class="nav-btn" onclick="showSearch()">&#128269; Search</button>
        </nav>

        <main id="mainContent">
            <div id="homeView" class="home-view">
                <div id="homeGreeting" class="home-greeting">
                    <button id="homeRefreshBtn" class="home-refresh-btn" onclick="loadHomeFeed()" title="Refresh feed">&#8635; Refresh</button>
                </div>
                <div id="homeContent" class="home-content">
                    <div class="loading">Loading your personalized feed...</div>
                </div>
            </div>

            <div id="searchView" class="search-view hidden">
                <div id="tabs" class="tabs hidden">
                    <button class="tab active" data-tab="songs" onclick="switchTab('songs')">Songs</button>
                    <button class="tab" data-tab="artists" onclick="switchTab('artists')">Artists</button>
                    <button class="tab" data-tab="albums" onclick="switchTab('albums')">Albums</button>
                </div>

                <div id="results" class="results"></div>

                <div id="artistView" class="artist-view hidden"></div>
                <div id="albumView" class="album-view hidden"></div>
            </div>
        </main>

        <div id="player" class="player hidden">
            <div class="player-info">
                <img id="playerThumb" src="" alt="">
                <div class="player-text">
                    <div id="playerTitle" class="player-title"></div>
                    <div id="playerArtist" class="player-artist"></div>
                    <div id="playerAlbumName" class="player-album"></div>
                </div>
            </div>
            <div class="player-kebab">
                <button class="kebab-btn" onclick="toggleKebabMenu(event)" title="More options">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
                <div id="kebabMenu" class="kebab-menu hidden">
                    <button onclick="openNowPlaying()">&#9654; Now Playing</button>
                    <button onclick="toggleLike()" id="likeBtn">&#9829; Like</button>
                    <div class="kebab-sep"></div>
                    <button onclick="viewArtist()">&#127908; View Artist</button>
                    <button onclick="viewAlbum()">&#128193; View Album</button>
                    <div class="kebab-sep"></div>
                    <button onclick="showSleepTimerMenu()">&#128338; Sleep Timer</button>
                </div>
                <div id="sleepTimerMenu" class="kebab-menu hidden">
                    <button onclick="startSleepTimer(15)">15 min</button>
                    <button onclick="startSleepTimer(30)">30 min</button>
                    <button onclick="startSleepTimer(45)">45 min</button>
                    <button onclick="startSleepTimer(60)">60 min</button>
                    <button onclick="startSleepTimer(90)">90 min</button>
                    <div class="kebab-sep"></div>
                    <button onclick="cancelSleepTimer()" class="cancel-btn">Cancel</button>
                </div>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" onclick="skipBackward()" title="Back 10s">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="9" y="16" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="togglePlay()" title="Play">
                        <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" onclick="skipForward()" title="Forward 10s">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="14" y="16" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
                    </button>
                    <button class="ctrl-btn" onclick="nextTrack()" title="Next">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                <div class="player-progress">
                    <span id="currentTime" class="time-label">0:00</span>
                    <input type="range" id="progressBar" min="0" max="100" value="0" oninput="seekAudio(this.value)">
                    <span id="totalTime" class="time-label">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <button id="upNextBtn" class="ctrl-btn up-next-btn" onclick="toggleUpNext()" title="Up Next">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <span id="sleepBadge" class="sleep-badge hidden"></span>
                <div class="player-volume">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#888"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <input type="range" id="volumeBar" min="0" max="100" value="80" oninput="setVolume(this.value)">
                </div>
            </div>
        </div>

        <div id="upNextPanel" class="up-next-panel hidden">
            <div class="up-next-header">
                <span class="up-next-title">Up Next</span>
                <button class="up-next-close" onclick="toggleUpNext()">&times;</button>
            </div>
            <div id="upNextList" class="up-next-list"></div>
        </div>

        <div id="nowPlayingOverlay" class="now-playing-overlay hidden">
            <button class="np-close" onclick="closeNowPlaying()">&times;</button>
            <div class="np-card">
                <img id="npThumb" class="np-thumb" src="" alt="">
                <div class="np-title" id="npTitle"></div>
                <div class="np-artist" id="npArtist"></div>
                <div class="np-album" id="npAlbum"></div>
                <div class="np-progress">
                    <span id="npCurrentTime" class="time-label">0:00</span>
                    <input type="range" id="npProgressBar" min="0" max="100" value="0" oninput="seekAudio(this.value)">
                    <span id="npTotalTime" class="time-label">0:00</span>
                </div>
                <div class="np-controls">
                    <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" onclick="skipBackward()" title="Back 10s">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="9" y="16" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
                    </button>
                    <button class="ctrl-btn play-btn" onclick="togglePlay()" title="Play">
                        <svg id="npPlayIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="npPauseIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl-btn skip-btn" onclick="skipForward()" title="Forward 10s">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="14" y="16" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">10</text></svg>
                    </button>
                    <button class="ctrl-btn" onclick="nextTrack()" title="Next">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
                <div class="np-actions">
                    <button class="np-action-btn" onclick="viewArtist()">&#127908; View Artist</button>
                    <button class="np-action-btn" onclick="viewAlbum()">&#128193; View Album</button>
                    <button class="np-action-btn" onclick="showSleepTimerMenu()">&#128338; Sleep Timer</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioElement" preload="auto"></audio>
    <script src="/app.js"></script>
</body>
</html>
